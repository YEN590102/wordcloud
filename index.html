<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時文字雲</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: #94a3b8; margin-top: 0.4rem; font-size: 0.95rem; }

    .input-area {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.2rem 1rem;
    }
    .input-area input {
      width: min(400px, 70vw);
      padding: 0.7rem 1rem;
      border-radius: 999px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #38bdf8; }
    .input-area button {
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-area button:hover { opacity: 0.85; }
    .input-area button:disabled { opacity: 0.4; cursor: default; }

    #status {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      min-height: 1.4rem;
      padding-bottom: 0.4rem;
    }

    #cloud-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.6rem 1rem;
      padding: 2rem 2rem 3rem;
      min-height: 300px;
    }

    .word-tag {
      display: inline-block;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: default;
      transition: transform 0.2s;
      animation: fadeIn 0.4s ease;
    }
    .word-tag:hover { transform: scale(1.08); }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    #count-bar {
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
      padding-bottom: 2rem;
    }
  </style>
</head>
<body>

<header>
  <h1>✨ 即時文字雲</h1>
  <p>輸入你的關鍵字，大家的答案即時出現！</p>
</header>

<div class="input-area">
  <input type="text" id="wordInput" placeholder="輸入關鍵字…" maxlength="20" autocomplete="off" />
  <button id="submitBtn" onclick="submitWord()">送出</button>
</div>
<div id="status"></div>

<div id="cloud-container">
  <span style="color:#334155;font-size:0.9rem">等待第一個關鍵字…</span>
</div>
<div id="count-bar"></div>

<!-- Firebase SDK (ESM) -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBj6Ha8li9TB5HEZE4j5Tqvx1Wh-Vabbg0",
    authDomain: "claude-7e0d5.firebaseapp.com",
    projectId: "claude-7e0d5",
    storageBucket: "claude-7e0d5.firebasestorage.app",
    messagingSenderId: "494658849708",
    appId: "1:494658849708:web:fff9c1e6e9b4b0e99ec809"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const COLORS = [
    ['#38bdf8','#0c4a6e'],['#818cf8','#1e1b4b'],['#34d399','#064e3b'],
    ['#fb923c','#431407'],['#f472b6','#500724'],['#facc15','#422006'],
    ['#a78bfa','#2e1065'],['#2dd4bf','#042f2e']
  ];

  // ── 即時監聽 ──────────────────────────────────────────
  const q = query(collection(db, 'wordcloud_words'));
  onSnapshot(q, (snapshot) => {
    const freq = {};
    snapshot.forEach(doc => {
      const w = (doc.data().word || '').trim();
      if (w) freq[w] = (freq[w] || 0) + 1;
    });
    renderCloud(freq, snapshot.size);
  });

  function renderCloud(freq, total) {
    const container = document.getElementById('cloud-container');
    const bar = document.getElementById('count-bar');
    if (Object.keys(freq).length === 0) {
      container.innerHTML = '<span style="color:#334155;font-size:0.9rem">等待第一個關鍵字…</span>';
      bar.textContent = '';
      return;
    }

    const maxCount = Math.max(...Object.values(freq));
    const sorted   = Object.entries(freq).sort((a, b) => b[1] - a[1]);

    container.innerHTML = sorted.map(([word, count], i) => {
      const ratio    = count / maxCount;
      const size     = Math.round(14 + ratio * 42);   // 14px – 56px
      const [fg, bg] = COLORS[i % COLORS.length];
      return `<span class="word-tag"
                style="font-size:${size}px;color:${fg};background:${bg};"
                title="${count} 票">
                ${word}${count > 1 ? ` <small style="font-size:0.65em;opacity:.7">×${count}</small>` : ''}
              </span>`;
    }).join('');

    bar.textContent = `共 ${total} 筆 · ${Object.keys(freq).length} 個關鍵字`;
  }

  // ── 送出 ──────────────────────────────────────────────
  window.submitWord = async function () {
    const input  = document.getElementById('wordInput');
    const btn    = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const word   = input.value.trim();
    if (!word) return;

    btn.disabled = true;
    status.textContent = '送出中…';
    try {
      await addDoc(collection(db, 'wordcloud_words'), {
        word,
        created_at: serverTimestamp()
      });
      status.textContent = `✅ 「${word}」已送出！`;
      input.value = '';
    } catch (e) {
      status.textContent = '❌ 送出失敗，請確認網路連線。';
      console.error(e);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  };

  // Enter 鍵送出
  document.getElementById('wordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.submitWord();
  });
</script>

</body>
</html>
